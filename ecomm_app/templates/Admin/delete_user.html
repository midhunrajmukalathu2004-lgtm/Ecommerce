
{% extends 'Admin/admin_home.html' %}
{% block content %}

<style>
    .delete-container {
        max-width: 500px;
        margin: 50px auto;
        padding: 30px;
        background: white;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        text-align: center;
    }

    .delete-container h2 {
        color: #dc3545;
        margin-bottom: 20px;
    }

    .delete-container p {
        color: #555;
        font-size: 15px;
        margin: 12px 0;
    }

    .user-details {
        background: #f8f9fa;
        padding: 15px;
        border-radius: 8px;
        margin: 20px 0;
        text-align: left;
    }

    .delete-btn {
        background: #dc3545;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 14px;
    }

    .delete-btn:hover {
        background: #bb2d3b;
    }

    .cancel-btn {
        display: inline-block;
        background: #6c757d;
        color: white;
        text-decoration: none;
        padding: 10px 20px;
        border-radius: 6px;
        margin-left: 10px;
    }

    .cancel-btn:hover {
        background: #565e64;
        color: white;
    }
</style>

<div class="delete-container">

    <h2>Delete User</h2>

    <p>Are you sure you want to delete this user?</p>

    <div class="user-details">
        <p><b>Name:</b> {{ data.full_name }}</p>
        <p><b>Email:</b> {{ data.email }}</p>
        <p><b>Phone:</b> {{ data.phone_no }}</p>
    </div>

    <form method="POST">
        {% csrf_token %}
        <button type="submit" class="delete-btn">Confirm Delete</button>
        <a href="/manage_user/" class="cancel-btn">Cancel</a>
    </form>

</div>

{% endblock %}
