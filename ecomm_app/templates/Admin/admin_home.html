
<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard</title>
</head>
{% block content%}

<body style="margin:0; font-family:Arial,sans-serif; background:#f4f6f9;">

    <!-- Header -->
    <div style="background:#222; color:white; padding:20px 30px;
                display:flex; justify-content:space-between;
                align-items:center;">

        <h2 style="margin:0;">Admin Panel</h2>

        <button onclick="window.location.href='/adminlogout/'"
            style="background:#dc3545; color:white; border:none;
                   padding:10px 20px; border-radius:5px;
                   cursor:pointer;">
            Logout
        </button>
    </div>

    <!-- Welcome Section -->
    <div style="padding:30px;">
        <h2 style="color:#333;">Welcome Admin 👋</h2>
        <p style="color:#777;">Manage your E-commerce website from here.</p>

        <!-- Dashboard Cards -->
        <div style="display:flex; gap:20px; flex-wrap:wrap;
                    margin-top:30px;">

            <div style="background:white; padding:25px;
                        border-radius:10px; flex:1; min-width:180px;
                        box-shadow:0 2px 8px #ddd;">
                <h3 style="color:#007bff;">Users</h3>
                <p>Manage registered customers</p>
                <button onclick="window.location.href='/manage_user/'"
                    style="background:#007bff; color:white; border:none;
                           padding:10px 15px; border-radius:5px;
                           cursor:pointer;">
                    View Users
                </button>
            </div>

            <div style="background:white; padding:25px;
                        border-radius:10px; flex:1; min-width:180px;
                        box-shadow:0 2px 8px #ddd;">
                <h3 style="color:#28a745;">Products</h3>
                <p>Manage available products</p>
                <button onclick="window.location.href='/manageproducts/'"
                    style="background:#28a745; color:white; border:none;
                           padding:10px 15px; border-radius:5px;
                           cursor:pointer;">
                    View Products
                </button>
            </div>

            <div style="background:white; padding:25px;
                        border-radius:10px; flex:1; min-width:180px;
                        box-shadow:0 2px 8px #ddd;">
                <h3 style="color:#fd7e14;">Orders</h3>
                <p>Manage customer orders</p>
                <button onclick="window.location.href='/manageorders/'"
                    style="background:#fd7e14; color:white; border:none;
                           padding:10px 15px; border-radius:5px;
                           cursor:pointer;">
                    View Orders
                </button>
            </div>

        </div>

    </div>

    <!-- Footer -->
    <div style="background:#222; color:white; text-align:center;
                padding:15px; margin-top:100px;">
        <p style="margin:0;">E-commerce Admin Panel © 2026</p>
    </div>

</body>
{% endblock%}
</html>
