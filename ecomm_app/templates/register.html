
<!DOCTYPE html>
<html>
<head>
    <title>Register</title>
</head>

<body style="margin: 0; font-family: Arial; background-color: #f2f2f2;">

    <div style="width: 350px; margin: 80px auto; padding: 30px;
                background-color: white; border-radius: 10px;
                box-shadow: 0 0 10px gray;">

        <h2 style="text-align: center; color: #333;">Create Account</h2>

        <form action="/register/" method="POST">
        {% csrf_token %} 

            <label>User Name</label>
            <input type="text" name="name" placeholder="Enter Username"
                style="width: 100%; padding: 10px; margin: 10px 0 15px;
                box-sizing: border-box;">

            <label>Email</label>
            <input type="email" name="email" placeholder="Enter your email"
                style="width: 100%; padding: 10px; margin: 10px 0 15px;
                box-sizing: border-box;">

            {% comment %} <label>Username</label>
            <input type="text" placeholder="Enter username"
                style="width: 100%; padding: 10px; margin: 10px 0 15px;
                box-sizing: border-box;"> {% endcomment %}

            <label>Phone No</label>
            <input type="phone" name="phone" placeholder="Enter Phone No"
                style="width: 100%; padding: 10px; margin: 10px 0 15px;
                box-sizing: border-box;">

            <label>Password</label>
            <input type="password" name="password" placeholder="Confirm password"
                style="width: 100%; padding: 10px; margin: 10px 0 20px;
                box-sizing: border-box;">

            <!-- <label>User Role</label>
            <input type="user_role" name="user_role" placeholder="Enter your role"
                style="width: 100%; padding: 10px; margin: 10px 0 20px;
                box-sizing: border-box;">     -->

            <button type="submit"
                style="width: 100%; padding: 12px; background-color: #222;
                color: white; border: none; border-radius: 5px;
                cursor: pointer;">
                Register
            </button>

        </form>

        <p style="text-align: center; margin-top: 20px;">
            Already have an account?
            <a href="/login/" style="color: blue; text-decoration: none;">
                Login
            </a>
        </p>

    </div>

</body>
</html>
